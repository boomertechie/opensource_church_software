name: Check listed repos

on:
  schedule:
    - cron: "0 14 * * 1"  # Mondays 14:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/check_listed_repos.py"
      - ".github/workflows/check-listed-repos.yml"
      - ".github/listed-repos-skip.txt"

permissions:
  issues: write
  contents: read

concurrency:
  group: check-listed-repos
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run health check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/check_listed_repos.py
