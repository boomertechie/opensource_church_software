name: Weekly trust check

on:
  schedule:
    # Tuesdays at 03:00 UTC — off-peak, after most Monday deploys have settled.
    - cron: "0 3 * * 2"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: weekly-trust
  cancel-in-progress: false

jobs:

  # -------------------------------------------------------------------------
  # Job 1: External link check with network (lychee with retries)
  # Files/updates a single rolling "Broken links report" issue on failure.
  # -------------------------------------------------------------------------
  links-external:
    name: External link check (with network)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check all links with lychee (external)
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --max-retries 3
            --retry-wait-time 5
            --exclude 'https://github\.com/.+/issues/new'
            --exclude 'https://github\.com/.+/compare/'
            --exclude 'https://github\.com/.+/pull/'
            --exclude 'mailto:'
            './**/*.md'
          # Do not auto-fail the step here — we handle failure below via the
          # issue upsert so the job leaves a clear artifact even on link errors.
          fail: false

      - name: Upsert broken-links issue (on failure)
        if: steps.lychee.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TITLE="Broken links report"
          BODY="$(cat <<'BODYEOF'
          _Auto-generated by \`.github/workflows/weekly-trust.yml\` — $(date -u +%Y-%m-%dT%H:%M:%SZ)_

          lychee found broken or unreachable links. See the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for the full lychee output.

          To silence a known-redirect or temporarily-unavailable URL, add it to the
          \`--exclude\` list in \`.github/workflows/weekly-trust.yml\`.
          BODYEOF
          )"

          # Look for an existing open issue with this title.
          EXISTING=$(gh issue list \
            --repo "$GH_REPO" \
            --state open \
            --search "\"$TITLE\" in:title" \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" \
              --repo "$GH_REPO" \
              --title "$TITLE" \
              --body "$BODY"
            echo "Updated existing issue #$EXISTING"
          else
            gh issue create \
              --repo "$GH_REPO" \
              --title "$TITLE" \
              --body "$BODY" \
              --label "maintenance"
            echo "Created new broken-links issue"
          fi

      - name: Close broken-links issue (on success)
        if: steps.lychee.outputs.exit_code == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TITLE="Broken links report"
          EXISTING=$(gh issue list \
            --repo "$GH_REPO" \
            --state open \
            --search "\"$TITLE\" in:title" \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" \
              --repo "$GH_REPO" \
              --comment "All links are passing as of this run — closing."
            echo "Closed issue #$EXISTING"
          fi

  # -------------------------------------------------------------------------
  # Job 2: Repo health check (tiered, posts rolling issue)
  # -------------------------------------------------------------------------
  repo-health:
    name: Repo health check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tiered repo health check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/check_listed_repos.py
