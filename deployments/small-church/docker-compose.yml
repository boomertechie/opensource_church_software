# Small Church Stack - Balanced Setup
# For established churches with 50-200 members
#
# What's Included:
# - WordPress (website + sermons)
# - ChurchCRM (ChMS with check-in)
# - Nextcloud (file storage, document collaboration)
# - Listmonk (email newsletters)
# - Uptime Kuma (monitoring)
# - Diun (image-update notifications)
#
# Requirements:
# - 2GB RAM minimum, 4GB recommended
# - Single domain with subdomains
# - Docker and Docker Compose installed

services:
  # Traefik reverse proxy
  # NOTE: Traefik mounts /var/run/docker.sock, which lets it read container labels and
  # route traffic automatically. This is standard practice but it means Traefik has
  # elevated access to the Docker host. Keep the image updated and treat Traefik as
  # high-trust infrastructure. If you want to reduce that exposure, look into
  # docker-socket-proxy (a read-only intermediary) — but that is an optional hardening
  # step, not required for most churches.
  traefik:
    image: traefik:v3.1
    container_name: small-church-traefik
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?set ACME_EMAIL in .env}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--ping=true"
      - "--accesslog=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt
      - ./traefik/access.log:/var/log/traefik/access.log
    networks:
      - small-church
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # WordPress - Website
  wordpress:
    image: wordpress:6.7
    container_name: small-church-wordpress
    environment:
      WORDPRESS_DB_HOST: wordpress-db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:?set WORDPRESS_DB_PASSWORD in .env}
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wordpress-data:/var/www/html
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wordpress.rule=Host(`${WORDPRESS_DOMAIN:?set WORDPRESS_DOMAIN in .env}`)"
      - "traefik.http.routers.wordpress.entrypoints=websecure"
      - "traefik.http.routers.wordpress.tls.certresolver=letsencrypt"
      - "traefik.http.services.wordpress.loadbalancer.server.port=80"
      # Security headers
      - "traefik.http.middlewares.wordpress-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.wordpress-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.wordpress-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.wordpress-headers.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.routers.wordpress.middlewares=wordpress-headers"
    networks:
      - small-church
    depends_on:
      - wordpress-db
    restart: unless-stopped

  # WordPress Database
  wordpress-db:
    image: mysql:8.0
    container_name: small-church-wordpress-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: ${WORDPRESS_DB_PASSWORD:?set WORDPRESS_DB_PASSWORD in .env}
    volumes:
      - wordpress-db-data:/var/lib/mysql
    networks:
      - small-church
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password

  # ChurchCRM - Church Management
  # ChurchCRM does not publish versioned image tags; pinned by digest to the last
  # verified stable build. Run `docker manifest inspect churchcrm/crm:latest` after
  # a ChurchCRM release announcement to get the new digest, then update this file.
  churchcrm:
    image: churchcrm/crm:latest@sha256:97057d29145ee60ae3c1070315bfc69e1c9955b63841491c6c7650574daff9bc
    container_name: small-church-churchcrm
    environment:
      CRM_DB_HOST: churchcrm-db
      CRM_DB_NAME: churchcrm
      CRM_DB_USER: churchcrm
      CRM_DB_PASS: ${CHURCHCRM_DB_PASSWORD:?set CHURCHCRM_DB_PASSWORD in .env}
    volumes:
      - churchcrm-data:/var/www/churchcrm
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.churchcrm.rule=Host(`${CHURCHCRM_DOMAIN:?set CHURCHCRM_DOMAIN in .env}`)"
      - "traefik.http.routers.churchcrm.entrypoints=websecure"
      - "traefik.http.routers.churchcrm.tls.certresolver=letsencrypt"
      - "traefik.http.services.churchcrm.loadbalancer.server.port=80"
      # Security headers
      - "traefik.http.middlewares.churchcrm-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.churchcrm-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.churchcrm-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.churchcrm-headers.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.routers.churchcrm.middlewares=churchcrm-headers"
    networks:
      - small-church
    depends_on:
      - churchcrm-db
    restart: unless-stopped

  # ChurchCRM Database
  churchcrm-db:
    image: mariadb:10.11
    container_name: small-church-churchcrm-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD_2:?set MYSQL_ROOT_PASSWORD_2 in .env}
      MYSQL_DATABASE: churchcrm
      MYSQL_USER: churchcrm
      MYSQL_PASSWORD: ${CHURCHCRM_DB_PASSWORD:?set CHURCHCRM_DB_PASSWORD in .env}
    volumes:
      - churchcrm-db-data:/var/lib/mysql
    networks:
      - small-church
    restart: unless-stopped

  # Nextcloud - File storage and collaboration
  nextcloud:
    image: nextcloud:29
    container_name: small-church-nextcloud
    environment:
      MYSQL_HOST: nextcloud-db
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${NEXTCLOUD_DB_PASSWORD:?set NEXTCLOUD_DB_PASSWORD in .env}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:?set NEXTCLOUD_ADMIN_USER in .env}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:?set NEXTCLOUD_ADMIN_PASSWORD in .env}
      NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_DOMAIN:?set NEXTCLOUD_DOMAIN in .env}
      REDIS_HOST: nextcloud-redis
    volumes:
      - nextcloud-data:/var/www/html
      - nextcloud-apps:/var/www/html/custom_apps
      - nextcloud-config:/var/www/html/config
      - nextcloud-data-files:/var/www/html/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nextcloud.rule=Host(`${NEXTCLOUD_DOMAIN:?set NEXTCLOUD_DOMAIN in .env}`)"
      - "traefik.http.routers.nextcloud.entrypoints=websecure"
      - "traefik.http.routers.nextcloud.tls.certresolver=letsencrypt"
      - "traefik.http.services.nextcloud.loadbalancer.server.port=80"
      # Security headers
      - "traefik.http.middlewares.nextcloud-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.nextcloud-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.nextcloud-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.nextcloud-headers.headers.referrerPolicy=strict-origin-when-cross-origin"
      # WebDAV fix for Traefik
      - "traefik.http.middlewares.nextcloud-dav.replacepathregex.regex=^/.well-known/(card|cal)dav"
      - "traefik.http.middlewares.nextcloud-dav.replacepathregex.replacement=/remote.php/dav/"
      - "traefik.http.routers.nextcloud.middlewares=nextcloud-headers,nextcloud-dav"
    networks:
      - small-church
    depends_on:
      - nextcloud-db
      - nextcloud-redis
    restart: unless-stopped

  # Nextcloud Database
  nextcloud-db:
    image: mariadb:10.11
    container_name: small-church-nextcloud-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD_3:?set MYSQL_ROOT_PASSWORD_3 in .env}
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${NEXTCLOUD_DB_PASSWORD:?set NEXTCLOUD_DB_PASSWORD in .env}
    volumes:
      - nextcloud-db-data:/var/lib/mysql
    networks:
      - small-church
    restart: unless-stopped

  # Redis for Nextcloud performance
  nextcloud-redis:
    image: redis:7-alpine
    container_name: small-church-nextcloud-redis
    volumes:
      - nextcloud-redis-data:/data
    networks:
      - small-church
    restart: unless-stopped

  # Listmonk - Email newsletters
  listmonk:
    image: listmonk/listmonk:v4.1.0
    container_name: small-church-listmonk
    environment:
      LISTMONK_app__address: "0.0.0.0:9000"
      LISTMONK_app__admin_username: ${LISTMONK_ADMIN_USER:?set LISTMONK_ADMIN_USER in .env}
      LISTMONK_app__admin_password: ${LISTMONK_ADMIN_PASSWORD:?set LISTMONK_ADMIN_PASSWORD in .env}
      LISTMONK_db__host: listmonk-db
      LISTMONK_db__port: "5432"
      LISTMONK_db__user: listmonk
      LISTMONK_db__password: ${LISTMONK_DB_PASSWORD:?set LISTMONK_DB_PASSWORD in .env}
      LISTMONK_db__database: listmonk
      LISTMONK_db__ssl_mode: disable
      TZ: ${TZ:-America/New_York}
    volumes:
      - listmonk-data:/listmonk/uploads
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.listmonk.rule=Host(`${LISTMONK_DOMAIN:?set LISTMONK_DOMAIN in .env}`)"
      - "traefik.http.routers.listmonk.entrypoints=websecure"
      - "traefik.http.routers.listmonk.tls.certresolver=letsencrypt"
      - "traefik.http.services.listmonk.loadbalancer.server.port=9000"
      # Security headers
      - "traefik.http.middlewares.listmonk-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.listmonk-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.listmonk-headers.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.routers.listmonk.middlewares=listmonk-headers"
    networks:
      - small-church
    depends_on:
      - listmonk-db
    restart: unless-stopped
    command: [sh, -c, "./listmonk --install --idempotent && ./listmonk"]

  # Listmonk Database
  listmonk-db:
    image: postgres:15-alpine
    container_name: small-church-listmonk-db
    environment:
      POSTGRES_PASSWORD: ${LISTMONK_DB_PASSWORD:?set LISTMONK_DB_PASSWORD in .env}
      POSTGRES_USER: listmonk
      POSTGRES_DB: listmonk
    volumes:
      - listmonk-db-data:/var/lib/postgresql/data
    networks:
      - small-church
    restart: unless-stopped

  # Uptime Kuma - Monitoring
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: small-church-uptime-kuma
    volumes:
      - uptime-kuma-data:/app/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.uptime-kuma.rule=Host(`${UPTIME_DOMAIN:?set UPTIME_DOMAIN in .env}`)"
      - "traefik.http.routers.uptime-kuma.entrypoints=websecure"
      - "traefik.http.routers.uptime-kuma.tls.certresolver=letsencrypt"
      - "traefik.http.services.uptime-kuma.loadbalancer.server.port=3001"
      # Security headers
      - "traefik.http.middlewares.uptime-kuma-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.uptime-kuma-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.uptime-kuma-headers.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.uptime-kuma-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.routers.uptime-kuma.middlewares=uptime-kuma-headers"
    networks:
      - small-church
    restart: unless-stopped

  # Diun - Notifies you when container image updates are available.
  # Diun does NOT auto-update containers — it emails you when a watched image has a new
  # tag, and you apply the update manually during a maintenance window.
  # After getting a notification: docker compose pull && docker compose up -d
  diun:
    image: ghcr.io/crazy-max/diun:4.33.0
    container_name: small-church-diun
    command: serve
    volumes:
      - diun-data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - TZ=${TZ:-America/New_York}
      - LOG_LEVEL=info
      - DIUN_WATCH_WORKERS=10
      - DIUN_WATCH_SCHEDULE=0 8 * * *
      - DIUN_PROVIDERS_DOCKER=true
      - DIUN_NOTIF_MAIL_HOST=${DIUN_EMAIL_SERVER:-smtp.gmail.com}
      - DIUN_NOTIF_MAIL_PORT=${DIUN_EMAIL_PORT:-587}
      - DIUN_NOTIF_MAIL_USERNAME=${DIUN_EMAIL_USER}
      - DIUN_NOTIF_MAIL_PASSWORD=${DIUN_EMAIL_PASSWORD}
      - DIUN_NOTIF_MAIL_FROM=${DIUN_EMAIL_FROM:-admin@example.com}
      - DIUN_NOTIF_MAIL_TO=${DIUN_EMAIL_TO:-admin@example.com}
    restart: unless-stopped

networks:
  small-church:
    driver: bridge

volumes:
  wordpress-data:
  wordpress-db-data:
  churchcrm-data:
  churchcrm-db-data:
  nextcloud-data:
  nextcloud-apps:
  nextcloud-config:
  nextcloud-data-files:
  nextcloud-db-data:
  nextcloud-redis-data:
  listmonk-data:
  listmonk-db-data:
  uptime-kuma-data:
  diun-data:
